<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaTeX bilingual review</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
<style>
  :root {
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#1c1917; --muted:#57534e;
    --line:#e7e5e4; --en:#1e3a5f; --zh:#3f2d1c; --mark:#fde68a; --accent:#9a3412;
    --del:#b91c1c; --del-bg:#fee2e2; --ins:#166534; --ins-bg:#dcfce7;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; overflow:hidden; font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif SC",serif; background:var(--bg); color:var(--ink); }
  header { flex-shrink:0; background:#fffdf8; border-bottom:1px solid var(--line); padding:14px 22px 12px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .meta { font-size:13px; color:var(--muted); line-height:1.45; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
  button,.file-btn { font:inherit; font-size:13px; border:1px solid #d6d3d1; background:#fff; padding:5px 10px; border-radius:6px; cursor:pointer; }
  button.primary { background:#1c1917; color:#fff; border-color:#1c1917; }
  button.active { background:#9a3412; color:#fff; border-color:#9a3412; }
  .count { font-size:13px; color:var(--accent); }
  .shell { flex:1; min-height:0; overflow:auto; }
  .page { display:grid; grid-template-columns:minmax(0,1fr) min(300px, 32vw); align-items:start; position:relative; min-height:100%; }
  body.notes-hidden .page { grid-template-columns:minmax(0,1fr); }
  body.notes-hidden #margin { display:none; }
  main { min-width:0; padding:18px 18px 48px 22px; }
  #margin { position:relative; min-height:100%; border-left:1px solid var(--line); background:#fffefb; }
  #margin-cards { position:relative; min-height:100%; }
  .margin-hint { padding:14px 12px; font-size:13px; color:var(--muted); }
  .sec-head { margin:28px 0 12px; padding-bottom:6px; border-bottom:2px solid #1c1917; font-size:20px; }
  .sub-head { margin:22px 0 8px; font-size:16px; color:#44403c; }
  .pair { background:var(--paper); border:1px solid var(--line); border-radius:10px; margin:10px 0 16px; overflow:hidden; }
  .pair-id { font-size:11px; letter-spacing:.04em; color:var(--muted); padding:7px 12px 0; }
  .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .cols.single { grid-template-columns:minmax(0,1fr); }
  .col { padding:10px 14px 14px; line-height:1.62; font-size:15.2px; min-width:0; }
  .col.en { border-right:1px solid var(--line); color:var(--en); }
  .col.zh { color:var(--zh); }
  .col h4 { margin:0 0 8px; font-size:13px; color:var(--muted); }
  .col .txt { overflow-wrap:anywhere; word-break:break-word; }
  .eq { margin:10px 0; overflow-x:auto; text-align:center; }
  del.wdel { color:var(--del); background:var(--del-bg); text-decoration:line-through; overflow-wrap:anywhere; }
  ins.wins { color:var(--ins); background:var(--ins-bg); text-decoration:underline; text-underline-offset:2px; overflow-wrap:anywhere; }
  .cite,.ref { font-size:0.92em; color:#78716c; }
  .tex-list { margin:0.45em 0 0.2em 1.25em; padding:0; }
  .tex-list li { margin:0.25em 0; }
  mark.hl { background:var(--mark); padding:0 .05em; border-radius:2px; }
  .katex.hl-math { background:var(--mark); border-radius:2px; }
  ::highlight(lbr-comment) { background-color:var(--mark); color:inherit; }
  .pair.has-comment { box-shadow:inset 3px 0 0 var(--accent); }
  #sel-btn { position:fixed; display:none; z-index:40; background:var(--accent); color:#fff; border:0; padding:6px 10px; border-radius:6px; font-size:13px; }
  .cmt, #composer { position:absolute; left:8px; right:8px; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:8px 10px; background:#fff; font-size:13.5px; box-shadow:0 1px 2px rgba(28,25,23,.04); }
  .cmt { cursor:pointer; }
  .cmt:hover, .cmt.active { border-color:#d6d3d1; background:#fffdf8; }
  .cmt .q, #comp-quote { color:var(--muted); font-style:italic; margin:4px 0; font-size:12.5px; }
  .cmt .t { font-size:11px; color:#a8a29e; }
  .cmt .del { float:right; font-size:12px; color:#b91c1c; background:none; border:0; cursor:pointer; }
  #composer { display:none; z-index:6; }
  #composer.visible { display:block; }
  #composer textarea { width:100%; min-height:72px; font:inherit; font-size:14px; padding:8px; border:1px solid #d6d3d1; border-radius:6px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1c1917; color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; display:none; z-index:50; }
  .legend { font-size:12px; color:var(--muted); }
  .legend del.wdel,.legend ins.wins { font-style:normal; padding:0 3px; }
  @media (max-width:900px){
    html, body { height:auto; overflow:auto; }
    .page { grid-template-columns:minmax(0,1fr); }
    #margin { border-left:0; border-top:1px solid var(--line); }
    .cmt, #composer { position:static; margin:8px; }
    .cols{grid-template-columns:minmax(0,1fr);}
    .col.en{border-right:0;border-bottom:1px solid var(--line);}
  }
</style>
</head>
<body>
<header>
  <h1 id="doc-title">审阅</h1>
  <div class="meta" id="doc-meta"></div>
  <div class="toolbar">
    <span class="count" id="count">0 条批注</span>
    <button type="button" id="mode-bi">中英对照</button>
    <button type="button" id="mode-diff">Word 审阅</button>
    <button type="button" id="mode-both">对照 + 审阅</button>
    <button class="primary" type="button" id="btn-export">导出批注到文件</button>
    <label class="file-btn">导入批注<input type="file" id="btn-import" accept="application/json,.json" hidden></label>
    <button type="button" id="btn-clear">清空本地批注</button>
    <button type="button" id="btn-toggle">隐藏批注栏</button>
    <span id="save-state" class="meta">仅浏览器本地</span>
    <span class="legend"><del class="wdel">删除</del> <ins class="wins">插入</ins> · 划选文字添加批注</span>
  </div>
</header>
<div class="shell" id="shell">
  <div class="page" id="page">
    <main id="main"></main>
    <aside id="margin" aria-label="批注栏">
      <div id="margin-cards"></div>
    </aside>
  </div>
</div>
<div id="composer">
  <div id="comp-quote"></div>
  <textarea id="comp-text" placeholder="写下批注…"></textarea>
  <div class="toolbar">
    <button class="primary" type="button" id="comp-save">保存</button>
    <button type="button" id="comp-cancel">取消</button>
  </div>
</div>
<button id="sel-btn" type="button">添加批注</button>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__REVIEW_DATA__*/null;
const KEY = (DATA && DATA.storage_key) || "lbr-review";
let MODE = DATA && DATA.has_diff ? "both" : "bi";

function esc(s) {
  return String(s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function fixMathInner(inner) {
  return String(inner || "").replace(/\\{2,}([a-zA-Z]+)/g, "\\$1");
}
function normalizeMath(s) {
  let t = String(s || "");
  for (let i = 0; i < 4; i++) {
    if (!t.includes("\\\\(") && !t.includes("\\\\[") && !t.includes("\\\\)")) break;
    t = t.replaceAll("\\\\(", "\\(").replaceAll("\\\\)", "\\)")
         .replaceAll("\\\\[", "\\[").replaceAll("\\\\]", "\\]");
  }
  t = t.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => "$" + m + "$");
  t = t.replace(/\$([^$]+)\$/g, (_, inner) => "$" + fixMathInner(inner) + "$");
  return t;
}
function latexHtml(s) {
  let raw = normalizeMath(s);
  const env = raw.match(/^\\begin\{(equation\*?|align\*?|displaymath)\}([\s\S]*)\\end\{\1\}\s*$/);
  if (env) return '<div class="eq">' + esc("\\[" + env[2].trim() + "\\]") + "</div>";
  if (/^\\\[/.test(raw)) return '<div class="eq">' + esc(raw) + "</div>";
  return texToHtml(raw);
}

function texToHtml(raw) {
  const math = [];
  let t = String(raw || "").replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+\$|\\\[[\s\S]+?\\\]/g, m => {
    math.push(m);
    return "\0M" + (math.length - 1) + "\0";
  });
  // Park lists before texInline: it calls esc() on the leftover string, which
  // would turn a real <ul> into visible &lt;ul&gt; (the 2026-09-09 bug).
  const lists = [];
  t = t.replace(/\\begin\{(itemize|enumerate)\}([\s\S]*?)\\end\{\1\}/g, (_, kind, body) => {
    const tag = kind === "enumerate" ? "ol" : "ul";
    const items = body.split(/\\item\b/).map(x => x.trim()).filter(Boolean);
    lists.push("<" + tag + ' class="tex-list">' + items.map(it => "<li>" + texInline(it, math) + "</li>").join("") + "</" + tag + ">");
    return "\0L" + (lists.length - 1) + "\0";
  });
  t = texInline(t, math);
  return t.replace(/\0L(\d+)\0/g, (_, i) => lists[+i]);
}

function texInline(t, math) {
  const html = [];
  const keep = h => { html.push(h); return "\0H" + (html.length - 1) + "\0"; };
  t = t.replace(/\\cite[tp]?\*?(\[[^\]]*\])?\{([^}]+)\}/g, (_, _o, keys) => {
    const list = keys.split(",").map(k => k.trim()).filter(Boolean);
    return keep('<span class="cite">[' + list.map(esc).join(", ") + "]</span>");
  });
  t = t.replace(/\\(eqref|Cref|cref|autoref|ref)\{([^}]+)\}/g, (_, cmd, key) => {
    const inner = cmd === "eqref" ? "(" + esc(key) + ")" : "[" + esc(key) + "]";
    return keep('<span class="ref">' + inner + "</span>");
  });
  t = t.replace(/\\(textbf|emph|textit|texttt|textsc)\{([^{}]*)\}/g, (_, cmd, inner) => {
    const tag = {textbf:"strong", emph:"em", textit:"em", texttt:"code", textsc:"span"}[cmd];
    return keep("<" + tag + ">" + esc(inner) + "</" + tag + ">");
  });
  t = t.replace(/\\%/g, "%").replace(/\\&/g, "&").replace(/\\_/g, "_");
  t = t.replace(/\\ /g, " ").replace(/~/g, "\u00a0").replace(/\\,/g, " ");
  t = t.replace(/\\(?:noindent|medskip|smallskip|bigskip|centering)\b/g, "");
  t = t.replace(/---/g, "—").replace(/--/g, "–");
  t = esc(t);
  t = t.replace(/\0H(\d+)\0/g, (_, i) => html[+i]);
  t = t.replace(/\0M(\d+)\0/g, (_, i) => math[+i]);
  return t;
}
function spansHtml(spans) {
  if (!spans || !spans.length) return "";
  // Stitch first so a word-level split still yields one complete itemize
  // environment; per-span latexHtml would leave raw \begin{itemize}.
  const raw = spans.map(s => {
    if (s.op === "eq") return s.text || "";
    if (s.op === "del") return "\0D\0" + (s.text || "") + "\0/D\0";
    if (s.op === "ins") return "\0I\0" + (s.text || "") + "\0/I\0";
    return s.text || "";
  }).join("");
  return latexHtml(raw)
    .replace(/\0D\0/g, '<del class="wdel">')
    .replace(/\0\/D\0/g, "</del>")
    .replace(/\0I\0/g, '<ins class="wins">')
    .replace(/\0\/I\0/g, "</ins>");
}

function render() {
  document.title = (DATA && DATA.title) || "审阅";
  document.getElementById("doc-title").textContent = (DATA && DATA.title) || "审阅";
  const meta = [];
  if (DATA && DATA.source) meta.push("源文件 " + DATA.source);
  if (DATA && DATA.old_ref) meta.push("对比 " + DATA.old_ref);
  meta.push("批注只在浏览器本地；点「导出批注到文件」后覆盖 review/" + ((DATA && DATA.comments_file) || "comments.json"));
  document.getElementById("doc-meta").textContent = meta.join(" · ");
  document.getElementById("mode-bi").classList.toggle("active", MODE === "bi");
  document.getElementById("mode-diff").classList.toggle("active", MODE === "diff");
  document.getElementById("mode-both").classList.toggle("active", MODE === "both");
  document.getElementById("mode-diff").style.display = DATA && DATA.has_diff ? "" : "none";
  document.getElementById("mode-both").style.display = DATA && DATA.has_diff ? "" : "none";

  const html = [];
  for (const u of (DATA && DATA.units) || []) {
    if (u.kind === "sec") {
      html.push('<h2 class="sec-head" id="u-' + u.id + '">' + esc(u.en) + (u.zh ? " / " + esc(u.zh) : "") + "</h2>");
      continue;
    }
    if (u.kind === "sub") {
      html.push('<h3 class="sub-head" id="u-' + u.id + '">' + esc(u.en) + (u.zh ? " / " + esc(u.zh) : "") + "</h3>");
      continue;
    }
    const enBody = (MODE !== "bi" && u.spans && u.spans.length)
      ? spansHtml(u.spans)
      : latexHtml(u.en || "");
    const showZh = MODE !== "diff";
    const single = !showZh;
    html.push(
      '<article class="pair" id="pair-' + u.id + '" data-id="' + u.id + '">' +
        '<div class="pair-id">' + esc(u.id) + " · §" + esc(u.sec) + (u.kind === "eq" ? " · eq" : "") + "</div>" +
        '<div class="cols' + (single ? " single" : "") + '">' +
          '<div class="col en" data-side="' + (MODE === "bi" ? "en" : "diff") + '"><h4>' +
            (MODE === "bi" ? "English" : "English · Word 审阅") + "</h4><div class=\"txt\">" + enBody + "</div></div>" +
          (showZh ? '<div class="col zh" data-side="zh"><h4>中文</h4><div class="txt">' + latexHtml(u.zh || "（待译）") + "</div></div>" : "") +
        "</div></article>"
    );
  }
  document.getElementById("main").innerHTML = html.join("");
  typesetMath();
  renderComments();
  paintHighlights();
}

function typesetMath() {
  const root = document.getElementById("main");
  if (!window.renderMathInElement || !root) return false;
  renderMathInElement(root, {
    delimiters: [
      {left:"\\[", right:"\\]", display:true},
      {left:"\\(", right:"\\)", display:false},
      {left:"$$", right:"$$", display:true},
      {left:"$", right:"$", display:false}
    ],
    throwOnError: false
  });
  paintHighlights();
  return true;
}

function loadComments() {
  try {
    const local = localStorage.getItem(KEY);
    if (local) return JSON.parse(local);
    if (DATA && Array.isArray(DATA.comments) && DATA.comments.length) {
      localStorage.setItem(KEY, JSON.stringify(DATA.comments));
      return DATA.comments;
    }
  } catch {}
  return [];
}
function saveComments(list) {
  localStorage.setItem(KEY, JSON.stringify(list));
  renderComments();
  paintHighlights();
  document.getElementById("count").textContent = list.length + " 条批注";
  document.getElementById("save-state").textContent = "已保存 · " + new Date().toLocaleTimeString();
}

function quoteRangeForComment(c) {
  const pair = document.getElementById("pair-" + c.paraId);
  if (!pair || !c.quote) return { pair, range: null };
  const col = pair.querySelector('.col[data-side="' + c.side + '"] .txt') || pair.querySelector(".txt");
  if (!col) return { pair, range: null };
  const { nodes, full } = visibleTextNodes(col);
  let off = null;
  if (c.from != null && c.to != null && c.to > c.from) {
    const slice = full.slice(c.from, c.to);
    if (slice === c.quote || normSpace(slice) === normSpace(c.quote)) off = { start: c.from, end: c.to };
  }
  if (!off) off = findQuoteOffsets(full, c.quote);
  if (!off) return { pair, range: null };
  return { pair, range: rangeFromOffsets(nodes, off.start, off.end) };
}
function anchorTopIn(el, rangeOrNode) {
  const box = el.getBoundingClientRect();
  const r = rangeOrNode.getClientRects ? (rangeOrNode.getClientRects()[0] || rangeOrNode.getBoundingClientRect()) : rangeOrNode.getBoundingClientRect();
  return r.top - box.top;
}
function layoutMarginComments() {
  const list = loadComments();
  document.getElementById("count").textContent = list.length + " 条批注";
  const page = document.getElementById("page");
  const cards = document.getElementById("margin-cards");
  const composer = document.getElementById("composer");
  const composing = composer.classList.contains("visible") && pending;
  if (composer.parentElement && composer.parentElement.id === "margin-cards") {
    document.body.appendChild(composer);
  }
  cards.innerHTML = "";
  if (!list.length && !composing) {
    cards.innerHTML = "<p class='margin-hint'>划选正文后点「添加批注」。卡片会出现在右侧栏、对齐划选行。</p>";
    cards.style.minHeight = "";
    return;
  }
  const placed = [];
  for (const c of list) {
    const el = document.createElement("div");
    el.className = "cmt";
    el.dataset.id = c.id;
    el.innerHTML =
      '<button class="del" type="button" data-del="' + c.id + '">删除</button>' +
      '<div class="t">' + esc(c.paraId) + " · " + esc(c.side) + " · " + esc((c.createdAt || "").replace("T"," ").slice(0,19)) + "</div>" +
      '<div class="q">「' + esc(c.quote) + "」</div>" +
      "<div>" + esc(c.comment) + "</div>";
    cards.appendChild(el);
    const loc = quoteRangeForComment(c);
    const y = loc.range ? anchorTopIn(page, loc.range) : (loc.pair ? anchorTopIn(page, loc.pair) : 8);
    placed.push({ el, y });
  }
  if (composing) {
    cards.appendChild(composer);
    const loc = quoteRangeForComment(pending);
    const y = loc.range ? anchorTopIn(page, loc.range) : (pending.paraId && document.getElementById("pair-" + pending.paraId) ? anchorTopIn(page, document.getElementById("pair-" + pending.paraId)) : 8);
    placed.push({ el: composer, y });
  }
  placed.sort((a, b) => a.y - b.y);
  let last = 8;
  const gap = 8;
  for (const item of placed) {
    let y = Math.max(8, item.y);
    if (y < last) y = last;
    item.el.style.top = y + "px";
    last = y + item.el.offsetHeight + gap;
  }
  const mainH = document.getElementById("main").offsetHeight;
  cards.style.minHeight = Math.max(last, mainH) + "px";
  document.querySelectorAll(".cmt [data-del]").forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation();
      saveComments(loadComments().filter(c => c.id !== btn.dataset.del));
    };
  });
  document.querySelectorAll(".cmt").forEach(el => {
    el.onclick = ev => {
      if (ev.target.dataset.del) return;
      document.querySelectorAll(".cmt.active").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      const c = loadComments().find(x => x.id === el.dataset.id);
      const target = c && document.getElementById("pair-" + c.paraId);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
  });
}
function renderComments() {
  layoutMarginComments();
}

function normSpace(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}
function findQuoteOffsets(full, quote) {
  if (!full || !quote) return null;
  const q = String(quote);
  const exact = full.indexOf(q);
  if (exact >= 0) return { start: exact, end: exact + q.length };
  const nq = normSpace(q);
  if (!nq) return null;
  const map = [];
  let nf = "";
  let prevSpace = true;
  for (let k = 0; k < full.length; k++) {
    const ch = full[k];
    if (/\s/.test(ch)) {
      if (!prevSpace) { nf += " "; map.push(k); }
      prevSpace = true;
    } else {
      nf += ch;
      map.push(k);
      prevSpace = false;
    }
  }
  let j = nf.indexOf(nq);
  let used = nq.length;
  if (j < 0) {
    const minLen = Math.min(12, nq.length);
    for (let len = nq.length - 1; len >= minLen; len--) {
      j = nf.indexOf(nq.slice(0, len));
      if (j >= 0) { used = len; break; }
    }
  }
  if (j < 0) return null;
  const start = map[j];
  const last = map[Math.min(j + used - 1, map.length - 1)];
  return { start, end: last + 1 };
}
function isHiddenText(node) {
  const el = node.parentElement;
  if (!el) return false;
  if (el.closest(".katex-mathml")) return true;
  if (el.closest(".katex") && el.closest("[aria-hidden='true']") && !el.closest(".katex-html")) return true;
  return false;
}
function visibleTextNodes(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
      if (isHiddenText(node)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let full = "";
  let node;
  while ((node = walker.nextNode())) {
    nodes.push({ node, start: full.length, end: full.length + node.nodeValue.length });
    full += node.nodeValue;
  }
  return { nodes, full };
}
function rangeFromOffsets(nodes, start, end) {
  let startNode, startOff, endNode, endOff;
  for (const n of nodes) {
    if (!startNode && start >= n.start && start < n.end) {
      startNode = n.node;
      startOff = start - n.start;
    }
    if (end > n.start && end <= n.end) {
      endNode = n.node;
      endOff = end - n.start;
    }
  }
  if (!startNode && nodes.length && start === nodes[0].start) {
    startNode = nodes[0].node;
    startOff = 0;
  }
  if (!startNode || !endNode) return null;
  const range = document.createRange();
  try {
    range.setStart(startNode, startOff);
    range.setEnd(endNode, endOff);
    return range;
  } catch {
    return null;
  }
}
function offsetsOfRange(nodes, range) {
  let start = null, end = null;
  for (const n of nodes) {
    if (n.node === range.startContainer && range.startContainer.nodeType === 3) start = n.start + range.startOffset;
    if (n.node === range.endContainer && range.endContainer.nodeType === 3) end = n.start + range.endOffset;
  }
  if (start != null && end != null) {
    if (start > end) { const t = start; start = end; end = t; }
    return { start, end };
  }
  for (const n of nodes) {
    const len = n.node.nodeValue.length;
    let firstIn = null, lastIn = null;
    for (let o = 0; o <= len; o++) {
      let c;
      try { c = range.comparePoint(n.node, o); } catch { firstIn = null; break; }
      if (c === 0) {
        if (firstIn == null) firstIn = o;
        lastIn = o;
      }
    }
    if (firstIn != null) {
      if (start == null) start = n.start + firstIn;
      end = n.start + lastIn;
    }
  }
  if (start == null || end == null || end <= start) return null;
  return { start, end };
}
function quoteFromHit(hit, sel) {
  const fallback = String(sel || "").trim();
  const colTxt = hit.col.querySelector(".txt") || hit.col;
  if (!sel || !sel.rangeCount) return { quote: fallback };
  const { nodes, full } = visibleTextNodes(colTxt);
  const off = offsetsOfRange(nodes, sel.getRangeAt(0));
  if (!off) return { quote: fallback };
  let start = off.start, end = off.end;
  while (start < end && /\s/.test(full[start])) start++;
  while (end > start && /\s/.test(full[end - 1])) end--;
  const quote = full.slice(start, end);
  return quote ? { quote, from: start, to: end } : { quote: fallback };
}
function applyMarkWrap(nodes, start, end) {
  const slice = nodes.filter(n => n.end > start && n.start < end);
  for (let i = slice.length - 1; i >= 0; i--) {
    const n = slice[i];
    const a = Math.max(start, n.start);
    const b = Math.min(end, n.end);
    if (a >= b) continue;
    const parent = n.node.parentElement;
    if (parent && parent.closest(".katex")) {
      parent.closest(".katex").classList.add("hl-math");
      continue;
    }
    const ls = a - n.start;
    const le = b - n.start;
    const node = n.node;
    if (le < node.nodeValue.length) node.splitText(le);
    const mid = ls > 0 ? node.splitText(ls) : node;
    const mark = document.createElement("mark");
    mark.className = "hl";
    mid.parentNode.insertBefore(mark, mid);
    mark.appendChild(mid);
  }
}
function paintHighlights() {
  document.querySelectorAll(".pair").forEach(p => p.classList.remove("has-comment"));
  document.querySelectorAll("mark.hl").forEach(m => {
    const p = m.parentNode;
    if (!p) return;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
    p.normalize();
  });
  document.querySelectorAll(".hl-math").forEach(el => el.classList.remove("hl-math"));
  if (window.CSS && CSS.highlights) CSS.highlights.delete("lbr-comment");
  const useApi = window.CSS && CSS.highlights && window.Highlight;
  const hl = useApi ? new Highlight() : null;
  for (const c of loadComments()) {
    const pair = document.getElementById("pair-" + c.paraId);
    if (!pair) continue;
    pair.classList.add("has-comment");
    const col = pair.querySelector('.col[data-side="' + c.side + '"] .txt') || pair.querySelector(".txt");
    if (!col || !c.quote) continue;
    const { nodes, full } = visibleTextNodes(col);
    let off = null;
    if (c.from != null && c.to != null && c.to > c.from) {
      const slice = full.slice(c.from, c.to);
      if (slice === c.quote || normSpace(slice) === normSpace(c.quote)) off = { start: c.from, end: c.to };
    }
    if (!off) off = findQuoteOffsets(full, c.quote);
    if (!off) continue;
    if (useApi) {
      const range = rangeFromOffsets(nodes, off.start, off.end);
      if (range) hl.add(range);
    } else {
      applyMarkWrap(nodes, off.start, off.end);
    }
  }
  if (hl) CSS.highlights.set("lbr-comment", hl);
  layoutMarginComments();
}

let pending = null;
const selBtn = document.getElementById("sel-btn");
function elemFromNode(n) {
  if (!n) return null;
  return n.nodeType === 1 ? n : n.parentElement;
}
function pairFromSelection(sel, ev) {
  const nodes = [elemFromNode(sel && sel.anchorNode), elemFromNode(sel && sel.focusNode)];
  if (ev) nodes.push(document.elementFromPoint(ev.clientX, ev.clientY));
  for (const node of nodes) {
    const col = node && node.closest && node.closest(".col");
    const pair = node && node.closest && node.closest(".pair");
    if (col && pair) return { col, pair };
  }
  return null;
}
function placeSelBtn(x, y) {
  selBtn.style.display = "block";
  const bw = selBtn.offsetWidth || 88;
  const bh = selBtn.offsetHeight || 32;
  let left = x + 8;
  let top = y + 8;
  if (left + bw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - bw - 8);
  if (top + bh > window.innerHeight - 8) top = Math.max(8, y - bh - 8);
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  selBtn.style.left = left + "px";
  selBtn.style.top = top + "px";
}
function hideSelBtn() { selBtn.style.display = "none"; }
document.addEventListener("mouseup", e => {
  if (selBtn.contains(e.target)) return;
  const sel = window.getSelection();
  const text = sel && String(sel).trim();
  if (!text || text.length < 2) { hideSelBtn(); return; }
  const hit = pairFromSelection(sel, e);
  if (!hit) { hideSelBtn(); return; }
  pending = Object.assign({ paraId: hit.pair.dataset.id, side: hit.col.dataset.side || "en" }, quoteFromHit(hit, sel));
  if (!pending.quote || pending.quote.length < 2) pending.quote = text;
  placeSelBtn(e.clientX, e.clientY);
});
document.getElementById("shell").addEventListener("scroll", hideSelBtn, { passive: true });
window.addEventListener("scroll", hideSelBtn, { passive: true });
selBtn.onclick = () => {
  if (!pending) return;
  document.getElementById("comp-quote").textContent = "「" + pending.quote.slice(0, 240) + "」 · " + pending.paraId;
  document.getElementById("comp-text").value = "";
  document.getElementById("composer").classList.add("visible");
  layoutMarginComments();
  document.getElementById("comp-text").focus();
  selBtn.style.display = "none";
};
document.getElementById("comp-cancel").onclick = () => {
  document.getElementById("composer").classList.remove("visible");
  pending = null;
  document.body.appendChild(document.getElementById("composer"));
  layoutMarginComments();
};
document.getElementById("comp-save").onclick = () => {
  const text = document.getElementById("comp-text").value.trim();
  if (!text || !pending) return;
  const list = loadComments();
  const row = { id: "c" + Date.now(), paraId: pending.paraId, side: pending.side, quote: pending.quote, comment: text, createdAt: new Date().toISOString() };
  if (pending.from != null && pending.to != null) {
    row.from = pending.from;
    row.to = pending.to;
  }
  list.push(row);
  saveComments(list);
  document.getElementById("composer").classList.remove("visible");
  pending = null;
  document.body.appendChild(document.getElementById("composer"));
  toast("已写入浏览器本地，尚未写入仓库文件");
};

document.getElementById("btn-export").onclick = () => {
  const blob = new Blob([JSON.stringify(loadComments(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (DATA && DATA.comments_file) || "comments.json";
  a.click();
  toast("已下载。浏览器不能直接改仓库文件，请用下载的文件覆盖 review/" + ((DATA && DATA.comments_file) || "comments.json"));
};
document.getElementById("btn-import").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      saveComments(data);
      toast("已导入 " + data.length + " 条");
    } catch { toast("JSON 无效"); }
  };
  r.readAsText(f);
  e.target.value = "";
};
document.getElementById("btn-clear").onclick = () => { if (confirm("清空本机批注？")) saveComments([]); };
function setNotesOpen(on) {
  document.body.classList.toggle("notes-hidden", !on);
  document.getElementById("btn-toggle").textContent = on ? "隐藏批注栏" : "显示批注栏";
  try { localStorage.setItem(KEY + "-panel", on ? "1" : "0"); } catch {}
  if (on) layoutMarginComments();
}
document.getElementById("btn-toggle").onclick = () => {
  setNotesOpen(document.body.classList.contains("notes-hidden"));
};
try {
  if (localStorage.getItem(KEY + "-panel") === "0") setNotesOpen(false);
} catch {}
window.addEventListener("resize", () => layoutMarginComments());
document.getElementById("mode-bi").onclick = () => { MODE = "bi"; render(); };
document.getElementById("mode-diff").onclick = () => { MODE = "diff"; render(); };
document.getElementById("mode-both").onclick = () => { MODE = "both"; render(); };

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2000);
}

if (!DATA || !DATA.units) {
  document.getElementById("main").innerHTML = "<p>未注入审阅数据。请用 scripts/build_review.py 生成此页。</p>";
} else {
  render();
  window.addEventListener("load", () => {
    if (!typesetMath()) {
      let n = 0;
      const t = setInterval(() => {
        if (typesetMath() || ++n > 20) {
          clearInterval(t);
          paintHighlights();
        }
      }, 150);
    }
  });
}
</script>
